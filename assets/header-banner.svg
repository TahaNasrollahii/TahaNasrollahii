<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="Taha Nasrollahi — Software Engineer · Back-End, Full-Stack &amp; AI Systems">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0d19"/>
      <stop offset="52%" stop-color="#17143a"/>
      <stop offset="100%" stop-color="#0f2942"/>
    </linearGradient>

    <radialGradient id="glowCyan" cx="82%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#24c6dc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#24c6dc" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowIndigo" cx="18%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#514a9d" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#302b63" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24c6dc" stop-opacity="0"/>
      <stop offset="25%" stop-color="#514a9d" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#24c6dc" stop-opacity="1"/>
      <stop offset="75%" stop-color="#514a9d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#24c6dc" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#302b63" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#24c6dc" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#302b63" stop-opacity="0.45"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#24c6dc" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#24c6dc" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#514a9d" stop-opacity="0.18"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>

    <clipPath id="cardClip">
      <rect x="0" y="0" width="1200" height="250" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <!-- Base & ambient glows -->
    <rect width="1200" height="250" fill="url(#bgGrad)"/>
    <rect width="1200" height="250" fill="url(#glowCyan)"/>
    <rect width="1200" height="250" fill="url(#glowIndigo)"/>
    <rect width="1200" height="250" fill="url(#grid)"/>

    <!-- Subtle decorative wave layers at bottom -->
    <path d="M0,198 C260,238 460,162 740,198 C960,226 1090,184 1200,194 L1200,250 L0,250 Z" fill="url(#waveGrad1)"/>
    <path d="M0,216 C310,182 590,242 890,206 C1040,188 1135,212 1200,206 L1200,250 L0,250 Z" fill="url(#waveGrad2)"/>

    <!-- Minimal terminal / architecture corner accents -->
    <g stroke="#24c6dc" stroke-opacity="0.32" stroke-width="1.5" fill="none">
      <path d="M 28 44 L 28 26 L 46 26"/>
      <path d="M 1172 44 L 1172 26 L 1154 26"/>
    </g>

    <!-- Main Name -->
    <text
      x="600"
      y="112"
      text-anchor="middle"
      fill="#ffffff"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif"
      font-size="58"
      font-weight="800"
      letter-spacing="-0.8"
    >Taha Nasrollahi</text>

    <!-- Center glowing divider -->
    <rect x="340" y="134" width="520" height="1.5" fill="url(#accentLine)"/>

    <!-- Role Subtitle -->
    <text
      x="600"
      y="168"
      text-anchor="middle"
      fill="#24c6dc"
      font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', 'Cascadia Code', Consolas, monospace"
      font-size="15.5"
      font-weight="600"
      letter-spacing="2.4"
    >SOFTWARE ENGINEER  ·  BACK-END, FULL-STACK &amp; AI SYSTEMS</text>
  </g>

  <!-- Crisp card border -->
  <rect x="0.75" y="0.75" width="1198.5" height="248.5" rx="15.25" ry="15.25" fill="none" stroke="#24c6dc" stroke-opacity="0.22" stroke-width="1.5"/>
</svg>
